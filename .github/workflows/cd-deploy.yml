name: CD - Deploy to EC2

on:
  # CI 워크플로들이 master에서 완료된 후 트리거
  workflow_run:
    workflows:
      - "CI"
    types:
      - completed
    branches:
      - master
  # 수동 배포
  workflow_dispatch:

jobs:
  deploy:
    name: SSH Deploy to EC2
    runs-on: ubuntu-latest
    # workflow_run으로 트리거된 경우 성공한 경우에만 배포
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "=== 최신 코드 pull ==="
            BEFORE=$(git rev-parse HEAD)
            git pull origin master
            AFTER=$(git rev-parse HEAD)

            # 변경된 파일 목록으로 빌드 대상 판별
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
            BACK_CHANGED=$(echo "$CHANGED" | grep -c '^blueocean_back/' || true)
            FRONT_CHANGED=$(echo "$CHANGED" | grep -c '^blueocean_front/' || true)

            if [ "$BACK_CHANGED" -gt 0 ]; then
              echo "=== 백엔드 변경 감지 — 의존성 설치 & 빌드 ==="
              cd blueocean_back
              npm ci
              npm run build
              npm prune --production
              cd ..
            else
              echo "::notice::백엔드 변경 없음 — 빌드 건너뜀"
            fi

            if [ "$FRONT_CHANGED" -gt 0 ]; then
              echo "=== 프론트엔드 변경 감지 — 의존성 설치 & 빌드 ==="
              cd blueocean_front
              npm ci
              NODE_ENV=production npm run build
              cd ..
            else
              echo "::notice::프론트엔드 변경 없음 — 빌드 건너뜀"
            fi

            echo "=== PM2 reload ==="
            pm2 reload ../ecosystem.config.js --update-env

            echo "=== 배포 완료 ==="
            pm2 status
