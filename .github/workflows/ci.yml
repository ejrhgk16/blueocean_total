name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 0: 변경 감지 — git diff로 어떤 폴더가 바뀌었는지 판별
  # ──────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      # 코드가 변경됐거나 캐시가 없으면 빌드 필요
      run-backend: ${{ steps.filter.outputs.backend == 'true' || steps.backend-cache-check.outputs.cache-hit != 'true' }}
      run-frontend: ${{ steps.filter.outputs.frontend == 'true' || steps.frontend-cache-check.outputs.cache-hit != 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'blueocean_back/**'
            frontend:
              - 'blueocean_front/**'

      # 캐시 존재 여부만 확인 (다운로드 없이 lookup만)
      - name: Check backend cache exists
        id: backend-cache-check
        uses: actions/cache/restore@v4
        with:
          path: blueocean_back/dist/
          key: backend-dist-${{ hashFiles('blueocean_back/src/**', 'blueocean_back/package-lock.json', 'blueocean_back/tsconfig.json', 'blueocean_back/nest-cli.json') }}
          lookup-only: true

      - name: Check frontend cache exists
        id: frontend-cache-check
        uses: actions/cache/restore@v4
        with:
          path: blueocean_front/.next/
          key: frontend-dist-${{ hashFiles('blueocean_front/src/**', 'blueocean_front/package-lock.json', 'blueocean_front/tsconfig.json', 'blueocean_front/next.config.*') }}
          lookup-only: true

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1: 백엔드 Build (소스 변경 또는 캐시 없을 때 실행)
  # ──────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend — Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.run-backend == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: blueocean_back/package-lock.json

      - name: Install dependencies
        working-directory: blueocean_back
        run: npm ci

      - name: Build
        working-directory: blueocean_back
        run: |
          echo "::notice::백엔드 소스 변경 감지 — 새로 빌드 실행"
          npm run build
        env:
          NODE_ENV: dev
          NODE_OPTIONS: '--max-old-space-size=2096'

      # 빌드 결과물을 캐시에 저장 (E2E에서 cache/restore로 재사용)
      - name: Save backend dist to cache
        uses: actions/cache/save@v4
        with:
          path: blueocean_back/dist/
          key: backend-dist-${{ hashFiles('blueocean_back/src/**', 'blueocean_back/package-lock.json', 'blueocean_back/tsconfig.json', 'blueocean_back/nest-cli.json') }}

      - name: Upload backend dist
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: blueocean_back/dist/
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2: 프론트엔드 Build (소스 변경 또는 캐시 없을 때 실행)
  # ──────────────────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend — Build
    runs-on: ubuntu-latest
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.run-frontend == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: blueocean_front/package-lock.json

      - name: Write frontend dev env file
        run: printf '%s' "$FRONT_DEV_ENV" > blueocean_front/.env.local
        shell: bash
        env:
          FRONT_DEV_ENV: ${{ secrets.FRONT_DEV_ENV }}

      - name: Install dependencies
        working-directory: blueocean_front
        run: npm ci

      - name: Build
        working-directory: blueocean_front
        run: |
          echo "::notice::프론트엔드 소스 변경 감지 — 새로 빌드 실행"
          npm run build

      - name: Remove Next.js build cache
        run: rm -rf blueocean_front/.next/cache/

      # 빌드 결과물을 캐시에 저장 (E2E에서 cache/restore로 재사용)
      - name: Save frontend dist to cache
        uses: actions/cache/save@v4
        with:
          path: blueocean_front/.next/
          key: frontend-dist-${{ hashFiles('blueocean_front/src/**', 'blueocean_front/package-lock.json', 'blueocean_front/tsconfig.json', 'blueocean_front/next.config.*') }}

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: blueocean_front/.next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1


  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3: Playwright E2E (항상 실행 — 빌드 결과물은 캐시에서 복원)
  # ──────────────────────────────────────────────────────────────────────────
  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [detect-changes, backend-ci, frontend-ci]
    # always()로 skipped 의존성도 통과시키되, 실패한 경우는 제외
    if: >
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.backend-ci.result != 'failure' &&
      needs.frontend-ci.result != 'failure'
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: blueocean_auto_test/package-lock.json

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('blueocean_auto_test/package-lock.json') }}

      # ── MySQL ──────────────────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start MySQL container
        run: |
          docker run -d \
            --name blueocean-mysql \
            -e MYSQL_ROOT_PASSWORD=rootpassword \
            -e MYSQL_DATABASE=BLUEOCEANDB \
            -e MYSQL_USER=BLUEOCEANUSER \
            -e MYSQL_PASSWORD=BLUEOCEAN \
            -p 3306:3306 \
            ghcr.io/${{ github.repository_owner }}/blueocean-mysql:latest

      - name: Wait for MySQL to be ready
        run: |
          echo "MySQL 컨테이너 ready 대기 중..."
          for i in $(seq 1 40); do
            if docker exec blueocean-mysql mysqladmin ping -u root -prootpassword --silent 2>/dev/null; then
              echo "MySQL ready (${i}번째 시도)"
              break
            fi
            if [ $i -eq 40 ]; then
              echo "MySQL 시작 실패"
              docker logs blueocean-mysql
              exit 1
            fi
            echo "대기 중... ($i/40)"
            sleep 3
          done

      # ── 빌드 결과물 캐시 복원 (env 파일 쓰기 전에 실행해야 hashFiles 일치) ─
      - name: Restore backend dist from cache
        uses: actions/cache/restore@v4
        with:
          path: blueocean_back/dist/
          key: backend-dist-${{ hashFiles('blueocean_back/src/**', 'blueocean_back/package-lock.json', 'blueocean_back/tsconfig.json', 'blueocean_back/nest-cli.json') }}
          fail-on-cache-miss: true

      - name: Restore frontend dist from cache
        uses: actions/cache/restore@v4
        with:
          path: blueocean_front/.next/
          key: frontend-dist-${{ hashFiles('blueocean_front/src/**', 'blueocean_front/package-lock.json', 'blueocean_front/tsconfig.json', 'blueocean_front/next.config.*') }}
          fail-on-cache-miss: true

      # ── Backend ────────────────────────────────────────────────────────────
      - name: Write backend dev env file
        run: |
          mkdir -p blueocean_back/src/config
          printf '%s' "$BACK_DEV_ENV" > blueocean_back/src/config/.dev.env
        shell: bash
        env:
          BACK_DEV_ENV: ${{ secrets.BACK_DEV_ENV }}

      - name: Install backend dependencies (prod only)
        working-directory: blueocean_back
        run: npm ci --omit=dev

      # ── Frontend ───────────────────────────────────────────────────────────
      - name: Write frontend dev env file
        run: printf '%s' "$FRONT_DEV_ENV" > blueocean_front/.env.local
        shell: bash
        env:
          FRONT_DEV_ENV: ${{ secrets.FRONT_DEV_ENV }}

      - name: Install frontend dependencies (prod only)
        working-directory: blueocean_front
        run: npm ci --omit=dev

      - name: Start frontend server
        working-directory: blueocean_front
        run: npm run start > /tmp/frontend.log 2>&1 &
        env:
          NODE_ENV: production

      - name: Start backend server
        working-directory: blueocean_back
        run: node dist/main > /tmp/backend.log 2>&1 &
        env:
          NODE_ENV: dev

      - name: Wait for backend to be ready
        run: |
          echo "백엔드(port 3000) ready 대기 중..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "백엔드 ready"
              exit 0
            fi
            if [ $i -eq 30 ]; then
              echo "백엔드 시작 실패 — 로그:"
              cat /tmp/backend.log
              exit 1
            fi
            echo "대기 중... ($i/30)"
            sleep 2
          done

      - name: Wait for frontend to be ready
        run: |
          echo "프론트엔드(port 3300) ready 대기 중..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3300 > /dev/null 2>&1; then
              echo "프론트엔드 ready"
              exit 0
            fi
            if [ $i -eq 30 ]; then
              echo "프론트엔드 시작 실패 — 로그:"
              cat /tmp/frontend.log
              exit 1
            fi
            echo "대기 중... ($i/30)"
            sleep 2
          done

      # ── Playwright ─────────────────────────────────────────────────────────
      - name: Install Playwright dependencies
        working-directory: blueocean_auto_test
        run: npm ci

      - name: Install Playwright browsers
        working-directory: blueocean_auto_test
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Install Playwright system dependencies
        working-directory: blueocean_auto_test
        run: npx playwright install-deps chromium

      - name: Create Playwright auth directory
        run: mkdir -p blueocean_auto_test/playwright/.auth

      - name: Run Playwright API tests
        working-directory: blueocean_auto_test
        run: npx playwright test tests/landing-api.spec.js
        env:
          CI: true

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: blueocean_auto_test/playwright-report/
          retention-days: 14
